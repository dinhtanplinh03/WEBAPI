<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sửa sản phẩm</title>
    <link rel="stylesheet" href="assets/css/admin-style.css">
</head>

<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <h2>Admin</h2>
        <ul>
            <li><a href="index.html">Dashboard</a></li>
            <li><a href="products.html">Quản lý sản phẩm</a></li>
            <li><a href="category.html">Quản lý danh mục</a></li>
            <li><a href="brand.html">Quản lý thương hiệu</a></li>
            <li><a href="orders.html">Quản lý đơn hàng</a></li>
            <li><a href="users.html">Quản lý người dùng</a></li>
            <li><a href="#" id="logout">Đăng xuất</a></li>
        </ul>
    </div>

    <h1>Sửa sản phẩm</h1>
    <form id="editProductForm" enctype="multipart/form-data">
        <input type="hidden" id="productId">

        <label for="name">Tên sản phẩm</label>
        <input type="text" id="name" required><br>

        <label for="brand">Thương hiệu</label>
        <select id="brand" required></select><br>

        <label for="category">Danh mục</label>
        <select id="category" required></select><br>

        <label for="price">Giá</label>
        <input type="number" id="price" required><br>

        <label for="stock">Tồn kho</label>
        <input type="number" id="stock" required><br>

        <label for="blocked">Khóa sản phẩm</label>
        <select id="blocked">
            <option value="0">Không</option>
            <option value="1">Có</option>
        </select><br>

        <label for="description">Mô tả</label>
        <textarea id="description" required></textarea><br>

        <label for="created_at">Ngày tạo</label>
        <input type="text" id="created_at" disabled><br>

        <label for="image">Ảnh sản phẩm</label>
        <input type="file" id="image" accept="image/*"><br>
        <img id="imagePreview" src="" width="100" style="display: none;"><br>

        <button type="submit">Lưu</button>
    </form>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get("id");

        async function loadDropdowns() {
            const brandResponse = await fetch("http://localhost:8080/api/products/brands");
            const categoryResponse = await fetch("http://localhost:8080/api/products/categories");
            const brands = await brandResponse.json();
            const categories = await categoryResponse.json();

            const brandSelect = document.getElementById("brand");
            const categorySelect = document.getElementById("category");

            brands.forEach(brand => {
                const option = document.createElement("option");
                option.value = brand.id;
                option.textContent = brand.name;
                brandSelect.appendChild(option);
            });

            categories.forEach(category => {
                const option = document.createElement("option");
                option.value = category.id;
                option.textContent = category.name;
                categorySelect.appendChild(option);
            });
        }

        async function loadProduct() {
            const response = await fetch(`http://localhost:8080/api/products/${productId}`);
            const product = await response.json();

            document.getElementById("productId").value = product.id;
            document.getElementById("name").value = product.name;
            document.getElementById("brand").value = product.brand.id;
            document.getElementById("category").value = product.category.id;
            document.getElementById("price").value = product.price;
            document.getElementById("stock").value = product.stock;
            document.getElementById("blocked").value = product.blocked ? "1" : "0";
            document.getElementById("description").value = product.description;
            document.getElementById("created_at").value = new Date(product.createdAt).toLocaleString("vi-VN");

            if (product.imageUrl) {
                document.getElementById("imagePreview").src = "http://localhost:8080" + product.imageUrl;
                document.getElementById("imagePreview").style.display = "block";
            }
        }

        document.getElementById("image").addEventListener("change", function (event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    document.getElementById("imagePreview").src = e.target.result;
                    document.getElementById("imagePreview").style.display = "block";
                };
                reader.readAsDataURL(file);
            }
        });

        document.getElementById("editProductForm").addEventListener("submit", async function (e) {
            e.preventDefault();

            const formData = new FormData();
            formData.append("name", document.getElementById("name").value);
            formData.append("brand_id", document.getElementById("brand").value);
            formData.append("category_id", document.getElementById("category").value);
            formData.append("price", document.getElementById("price").value);
            formData.append("stock", document.getElementById("stock").value);
            formData.append("blocked", document.getElementById("blocked").value);
            formData.append("description", document.getElementById("description").value);

            if (document.getElementById("image").files[0]) {
                formData.append("image", document.getElementById("image").files[0]);
            }

            const response = await fetch(`http://localhost:8080/api/products/${productId}`, {
                method: "PUT",
                body: formData
            });

            if (response.ok) {
                alert("Cập nhật thành công!");
                window.location.href = "products.html";
            } else {
                alert("Cập nhật thất bại!");
            }
        });

        document.addEventListener("DOMContentLoaded", async () => {
            await loadDropdowns();
            await loadProduct();
        });
        //Đăng xuất
        document.getElementById("logout").addEventListener("click", function () {
            alert("Đã đăng xuất!");
            window.location.href = "../login.html";
        });
    </script>

</body>

</html>
