<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách sản phẩm</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <!-- Header -->
    <div id="header-container"></div>

    <!-- Bộ lọc sản phẩm -->
    <section class="filter">
        <select id="categoryFilter">
            <option value="all">Tất cả danh mục</option>
        </select>
        <select id="brandFilter">
            <option value="all">Tất cả thương hiệu</option>
        </select>
        <input type="number" id="minPrice" placeholder="Giá từ...">
        <input type="number" id="maxPrice" placeholder="Giá đến...">
        <input type="text" id="searchBox" placeholder="Tìm kiếm sản phẩm...">
        <button onclick="filterProducts()">Lọc</button>
    </section>

    <!-- Danh sách sản phẩm -->
    <section class="products">
        <h2>Danh sách sản phẩm</h2>
        <div class="product-list" id="product-list">
            <!-- Danh sách sản phẩm sẽ hiển thị ở đây -->
        </div>
    </section>

    <script>
        const API_BASE_URL = "http://localhost:8080/api"; // URL backend
        const IMAGE_BASE_URL = "http://localhost:8080"; // Đường dẫn ảnh sản phẩm

        let categoriesLoaded = false; // ✅ Tránh gọi API nhiều lần

        // Load header
        fetch("assets/components/header.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("header-container").innerHTML = data;
                loadFilters(); // Gọi API danh mục & thương hiệu
            })
            .catch(error => console.error("Lỗi tải header:", error));

        // Lấy danh mục và thương hiệu
        function loadFilters() {
            if (categoriesLoaded) return; // ✅ Ngăn gọi API lặp lại
            categoriesLoaded = true;
            fetch(`${API_BASE_URL}/categories`)
                .then(response => response.json())
                .then(categories => {
                    const categoryFilter = document.getElementById("categoryFilter");
                    categories.forEach(category => {
                        const option = document.createElement("option");
                        option.value = category.id;
                        option.textContent = category.name;
                        categoryFilter.appendChild(option);
                    });
                })
                .catch(error => console.error("Lỗi tải danh mục:", error));

            fetch(`${API_BASE_URL}/brands`)
                .then(response => response.json())
                .then(brands => {
                    const brandFilter = document.getElementById("brandFilter");
                    brands.forEach(brand => {
                        const option = document.createElement("option");
                        option.value = brand.id;
                        option.textContent = brand.name;
                        brandFilter.appendChild(option);
                    });
                })
                .catch(error => console.error("Lỗi tải thương hiệu:", error));

            loadProducts(); // Tải sản phẩm khi bộ lọc đã tải xong
        }

        // Lấy danh sách sản phẩm từ API
        function loadProducts(categoryId = "all", brandId = "all", minPrice = 0, maxPrice = Infinity, searchQuery = "") {
            let url = `${API_BASE_URL}/products`;

            fetch(url)
                .then(response => response.json())
                .then(products => {
                    let filteredProducts = products
                        .filter(product => categoryId === "all" || product.category.id == categoryId)
                        .filter(product => brandId === "all" || product.brand.id == brandId)
                        .filter(product => product.price >= minPrice && product.price <= maxPrice)
                        .filter(product => product.name.toLowerCase().includes(searchQuery.toLowerCase()));

                    displayProducts(filteredProducts);
                })
                .catch(error => console.error("Lỗi tải sản phẩm:", error));
        }

        // Hiển thị danh sách sản phẩm
        function displayProducts(productArray) {
            const productList = document.getElementById("product-list");
            productList.innerHTML = "";

            productArray.forEach(product => {
                const imageUrl = product.imageUrl ? `${IMAGE_BASE_URL}${product.imageUrl}` : "assets/img/default.png";

                const productHTML = `
                <div class="product">
                    <img src="${imageUrl}" alt="${product.name}" onerror="this.src='assets/img/default.png'">
                    <h3>${product.name}</h3>
                    <p>Giá: ${product.price.toLocaleString("vi-VN")}đ</p>
                    <button onclick="viewProductDetail(${product.id})">Chi tiết</button>
                    <button onclick='addToCart(${JSON.stringify(product)})'>Thêm vào giỏ</button>
                </div>
            `;
                productList.innerHTML += productHTML;
            });
        }

        // Xem chi tiết sản phẩm
        function viewProductDetail(productId) {
            window.location.href = `product-detail.html?id=${productId}`;
        }

        // Thêm sản phẩm vào giỏ hàng
        function addToCart(product) {
            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            let existing = cart.find(item => item.id === product.id);
            if (existing) {
                existing.quantity += 1;
            } else {
                product.quantity = 1;
                cart.push(product);
            }
            localStorage.setItem("cart", JSON.stringify(cart));
            alert("Đã thêm vào giỏ hàng!");
        }

        // Lọc sản phẩm theo danh mục, thương hiệu, giá và tìm kiếm
        function filterProducts() {
            const categoryId = document.getElementById("categoryFilter").value;
            const brandId = document.getElementById("brandFilter").value;
            const minPrice = document.getElementById("minPrice").value || 0;
            const maxPrice = document.getElementById("maxPrice").value || Infinity;
            const searchQuery = document.getElementById("searchBox").value;

            loadProducts(categoryId, brandId, minPrice, maxPrice, searchQuery);
        }

        // Khi danh mục, thương hiệu thay đổi, tự động lọc sản phẩm
        document.getElementById("categoryFilter").addEventListener("change", filterProducts);
        document.getElementById("brandFilter").addEventListener("change", filterProducts);

        // Tải danh sách sản phẩm khi trang mở
        document.addEventListener("DOMContentLoaded", () => {
            loadFilters();
        });

    </script>

</body>

</html>
